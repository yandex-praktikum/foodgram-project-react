name: Foodprivet

on: 
  push:
    branches:
      - zond.2

jobs:
  tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
      
        uses: actions/setup-python@v4
        with:
          python-version: 3.7
      
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pep8-naming flake8-broken-line flake8-return flake8-isort
          pip install -r backend/requirements.txt
          
      - name: test with flake8
        run: |
          python -m flake8

  build_and_push_to_docker_hub:
    name: push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: check out the repo
        uses: actions/checkout@v3
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: push frontend to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:latest

      - name: push backend to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram:latest

  deploy:
    if: github.ref == 'refs/heads/zond.2'
    runs-on: ubuntu-latest
    needs:
      build_and_push_to_docker_hub
    steps:
    - name: checkout repo
      uses: actions/checkout@v3     
    - name: copy docker-compose.yml via ssh
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "./infra/docker-compose.yml"
        target: "food"
    - name: executing remote ssh command to deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          cd food
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:latest
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/foodgram:latest
          sudo docker compose down
          sudo docker compose rm backend
          sudo docker compose up -d


