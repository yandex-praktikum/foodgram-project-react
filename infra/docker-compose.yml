version: '3'

volumes:
  pg_data_volume:
  static_volume:
  media_volume:

services:

  db:
    container_name: food_db
    image: postgres:13
    env_file:
      - ../.env
    volumes:
      - pg_data_volume:/var/lib/postgresql/data
  
  backend:
    container_name: food_back
    build: ../backend
    env_file:
      - ../.env
    volumes:
      - static_volume:/static
      - media_volume:/app/mediafiles
    depends_on:
      - db

  frontend:
    container_name: food_front
    env_file:
      - ../.env
    build: ../frontend/
    command: cp -r /app/build/. /static/
    volumes:
      - static_volume:/static

  nginx:
    container_name: food_nginx
    image: nginx:1.19.3
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static_volume:/static
      - media_volume:/mediafiles
    depends_on:
      - backend
