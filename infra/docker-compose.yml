version: '3'

volumes:
    pg_data:
    static:
    media:

services:
  db:
    container_name: foodb
    image: postgres:13.3-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    container_name: backend
    image: devinse/foodgram
    env_file: .env
    volumes:
      - static:/app/static/
      - media:/app/media
    restart: always
    depends_on: 
        - db
  frontend:
    container_name: frontend
    env_file: .env
    image: devinse/foodgram_frontend
    command: cp -r /app/result_build/. /frontend_static/
    volumes:
      - ../frontend/:/app/result_build/
    depends_on:
      - backend
  nginx:
    container_name: food-nginx
    env_file: .env
    image: devinse/nginx
    depends_on:
      - frontend
      # backend:
        # condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend_static:/usr/share/nginx/html
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static:/var/html/
      - media:/var/html/media/recipes/
    ports:
      - 8080:80
