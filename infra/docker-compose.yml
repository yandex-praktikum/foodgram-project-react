version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    container_name: db
    image: postgres:13.3-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: devinse/foodgram
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/media
    restart: always
    depends_on: 
        - db
  frontend:
    env_file: .env
    image: devinse/foodgram_frontend
    command: cp -r /app/result_build/. /frontend_static/
    volumes:
      - static:/frontend_static
    depends_on:
      - backend
  nginx:
    image: nginx:1.24.0
    env_file: .env
    volumes:
      - nginx.conf:/etc/nginx/conf.d/default.conf
      - static:/staticfiles
      - media:/media
    depends_on: 
        - backend
    ports:
      - 7000:80

